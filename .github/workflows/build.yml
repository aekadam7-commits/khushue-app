name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare assets folder
        run: |
          mkdir -p assets
          if [ -f icon.png ]; then
            cp icon.png assets/icon.png
            mkdir -p assets/splash
            cp icon.png assets/splash/splash.png
          fi

      - name: Install dependencies
        run: npm install

      - name: Cache Quran data
        uses: actions/cache@v4
        with:
          path: .cache
          key: quran-data-v1

      - name: Prepare offline web assets (www)
        run: node scripts/prepare-offline.js

      - name: Check reciter links (informational)
        continue-on-error: true
        run: node scripts/check-reciters.js

      - name: Add Android platform
        run: npx cap add android

      - name: Add Android permissions to Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          if grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            echo "Permissions already exist"
          else
            sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <application|' "$MANIFEST"
          fi
          
          echo "=== AndroidManifest.xml ==="
          head -25 "$MANIFEST"

      - name: Generate icons and splash screens
        run: npx @capacitor/assets generate --android || echo "Asset generation skipped"

      - name: Sync web assets
        run: npx cap sync android

      - name: Copy Adhan & Dua sounds to Android raw
        run: |
          RAW_DIR="android/app/src/main/res/raw"
          DRAWABLE_DIR="android/app/src/main/res/drawable"
          mkdir -p "$RAW_DIR"
          mkdir -p "$DRAWABLE_DIR"

          for sound in adhan1 adhan2 adhan_fajr dua_adhan; do
            if [ -f "sounds/${sound}.mp3" ]; then
              cp "sounds/${sound}.mp3" "$RAW_DIR/${sound}.mp3"
            fi
          done

          if [ -f "icon.png" ]; then
            cp icon.png "$DRAWABLE_DIR/ic_stat_adhan.png"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for direct download
        run: cp android/app/build/outputs/apk/debug/*.apk khushu.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: khushu-apk
          path: khushu.apk

      - name: Publish direct APK download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" khushu.apk \
            --repo "${{ github.repository }}" \
            --title "خُشوع - إصدار ${{ github.run_number }}" \
            --notes "تحميل تطبيق خُشوع بصيغة APK" \
            --latest
